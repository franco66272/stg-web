<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HandCam Game</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="app"><header><div><h1>HandCam Game</h1><p>Tracking humano de manos + cuerpo para juegos de movimiento.</p></div><button id="startBtn">Iniciar cámara</button></header><section id="stage" class="stage"><video id="video" playsinline autoplay muted></video><canvas id="overlay"></canvas><div id="status" class="status">Cámara detenida</div></section><section class="controls"><label>Predicción <input id="predictionMs" type="range" min="0" max="450" step="10" value="180"><output id="predictionValue">180 ms</output></label><label>Suavizado <input id="smoothing" type="range" min="0.05" max="0.8" step="0.01" value="0.35"><output id="smoothingValue">0.35</output></label><label><input id="mirror" type="checkbox" checked> Vista espejo</label><label><input id="drawPose" type="checkbox" checked> Dibujar cuerpo</label></section><section class="hud"><div>FPS <b id="fps">0</b></div><div>Izq <b id="leftState">—</b></div><div>Der <b id="rightState">—</b></div><div>Cuerpo <b id="poseState">—</b></div><div>Humano <b id="humanState">—</b></div><div>Teléfono <b id="phoneState">No conectado</b></div></section></main><script type="module" src="app.js"></script></body></html>
