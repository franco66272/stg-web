<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HandCam Saber Arena</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app">
<header><div><h1>HandCam Saber Arena</h1><p>Entrenamiento 3D con tracking de manos.</p></div><button id="startBtn">Iniciar cámara</button></header>
<section id="stage" class="stage"><video id="video" playsinline autoplay muted></video><canvas id="overlay"></canvas><div id="game" class="game" aria-hidden="true"><div class="lane left"></div><div class="lane right"></div><div id="notes"></div><div id="crosshair"></div><div class="gameHud"><b>COMBO <span id="combo">0</span></b><b>PUNTOS <span id="score">0</span></b></div></div><div id="status" class="status">Cámara detenida</div></section>
<section class="controls"><button id="gameBtn" disabled>Iniciar entrenamiento</button><label>Predicción <input id="predictionMs" type="range" min="0" max="450" step="10" value="150"><output id="predictionValue">150 ms</output></label><label>Suavizado <input id="smoothing" type="range" min="0.05" max="0.8" step="0.01" value="0.2"><output id="smoothingValue">0.20</output></label><label><input id="mirror" type="checkbox" checked> Vista espejo</label><label><input id="drawPose" type="checkbox" checked> Dibujar cuerpo</label></section>
<section class="hud"><div>FPS <b id="fps">0</b></div><div>Izq <b id="leftState">—</b></div><div>Der <b id="rightState">—</b></div><div>Cuerpo <b id="poseState">—</b></div><div>Humano <b id="humanState">—</b></div><div>Teléfono <b id="phoneState">No conectado</b></div></section>
</main>
<script type="module" src="app.js"></script>
<script type="module" src="game-boot.js"></script>
</body>
</html>
